name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup D
        uses: dlang-community/setup-dlang@v1
        with:
          compiler: ldc-latest
      - name: Unit tests
        run: dub build --config=unittest && ./bin/thumbdrive-multiboot-test
      - name: Build CLI
        run: dub build --config=application
