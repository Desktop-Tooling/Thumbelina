<?xml version="1.0" encoding="UTF-8"?>
<!-- App-tile version of the simple Thumbelina USB mark. -->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 128 128"
     role="img"
     aria-label="Thumbelina">
  <title>Thumbelina</title>
  <defs>
    <linearGradient id="tile" x1="16" y1="12" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a535c"/>
      <stop offset="100%" stop-color="#071820"/>
    </linearGradient>
    <linearGradient id="rim" x1="8" y1="8" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f3e2a7"/>
      <stop offset="100%" stop-color="#c9a227"/>
    </linearGradient>
    <linearGradient id="body" x1="36" y1="28" x2="92" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff8fb8"/>
      <stop offset="55%" stop-color="#e91e8c"/>
      <stop offset="100%" stop-color="#9b1b5e"/>
    </linearGradient>
    <linearGradient id="gold" x1="48" y1="88" x2="80" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f3e2a7"/>
      <stop offset="100%" stop-color="#c9a227"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#rim)"/>
  <rect x="10" y="10" width="108" height="108" rx="24" fill="url(#tile)"/>

  <g id="thumbelina-glyph" transform="translate(0 2)">
    <rect x="36" y="24" width="56" height="62" rx="12" fill="url(#body)"/>
    <rect x="42" y="32" width="8" height="40" rx="4" fill="#ffffff" opacity="0.28"/>
    <rect x="54" y="38" width="28" height="16" rx="3" fill="#fff0f6" opacity="0.9"/>
    <rect x="57" y="43" width="22" height="3" rx="1.5" fill="#c9a227"/>
    <rect x="48" y="84" width="32" height="18" rx="2.5" fill="url(#gold)" stroke="#8a6a12" stroke-width="1.25"/>
    <rect x="53" y="89" width="7" height="8" rx="1" fill="#6d4c0f" opacity="0.55"/>
    <rect x="68" y="89" width="7" height="8" rx="1" fill="#6d4c0f" opacity="0.55"/>
  </g>
</svg>
