<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Thumbelina">
  <!-- Simplified mark: gold frame + pink petal boat + USB tip (scalable companion to the painted PNG). -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0d78c"/>
      <stop offset="55%" stop-color="#c9a227"/>
      <stop offset="100%" stop-color="#8a6a12"/>
    </linearGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff8fb8"/>
      <stop offset="100%" stop-color="#e0488a"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f4d5c"/>
      <stop offset="100%" stop-color="#0d2430"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="48" fill="url(#water)" stroke="url(#gold)" stroke-width="14"/>
  <!-- lily pad -->
  <ellipse cx="168" cy="168" rx="52" ry="18" fill="#3f7a45" opacity="0.85"/>
  <!-- petal boat -->
  <path d="M70 150 C90 110 150 100 190 128 C200 136 198 150 186 156 C150 172 110 172 86 160 C74 154 68 158 70 150 Z" fill="url(#petal)"/>
  <!-- sepal -->
  <path d="M186 128 C200 122 214 128 220 140 C212 148 200 150 190 146 Z" fill="#5a9a4a"/>
  <!-- USB-A tip -->
  <rect x="214" y="132" width="28" height="20" rx="2" fill="#cfd5db" stroke="#8b939a" stroke-width="1.5"/>
  <rect x="218" y="137" width="5" height="5" fill="#6b7280"/>
  <rect x="218" y="145" width="5" height="5" fill="#6b7280"/>
  <!-- figure silhouette -->
  <circle cx="128" cy="118" r="12" fill="#f3d5a5"/>
  <path d="M116 128 C118 148 138 150 140 130 C136 142 120 142 116 128 Z" fill="#3b6ea5"/>
  <path d="M116 112 C110 100 124 92 136 100 C142 104 140 118 132 120 C124 122 118 118 116 112 Z" fill="#e8c56a"/>
  <!-- title band hint -->
  <text x="128" y="214" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#e8c76b">Thumbelina</text>
</svg>
