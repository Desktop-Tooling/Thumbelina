<?xml version="1.0" encoding="UTF-8"?>
<!--
  Thumbelina app mark — glyph on a rounded icon tile (gold rim + deep water field).
  For transparent/composable use, prefer thumbelina-glyph.svg (no tile).
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 256 256"
     role="img"
     aria-label="Thumbelina">
  <title>Thumbelina</title>
  <defs>
    <linearGradient id="tileWater" x1="40" y1="24" x2="220" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a535c"/>
      <stop offset="55%" stop-color="#0f2f3a"/>
      <stop offset="100%" stop-color="#071820"/>
    </linearGradient>
    <linearGradient id="tileGold" x1="20" y1="20" x2="236" y2="236" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f3e2a7"/>
      <stop offset="50%" stop-color="#c9a227"/>
      <stop offset="100%" stop-color="#7a5a10"/>
    </linearGradient>
    <linearGradient id="petalGrad" x1="48" y1="96" x2="196" y2="168" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffb3d0"/>
      <stop offset="45%" stop-color="#f06292"/>
      <stop offset="100%" stop-color="#c2185b"/>
    </linearGradient>
    <linearGradient id="sepalGrad" x1="176" y1="118" x2="208" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#81c784"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="usbGrad" x1="202" y1="120" x2="230" y2="148" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#eceff1"/>
      <stop offset="100%" stop-color="#90a4ae"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="108" y1="88" x2="136" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="100%" stop-color="#f9a825"/>
    </linearGradient>
    <clipPath id="tileClip">
      <rect x="18" y="18" width="220" height="220" rx="48"/>
    </clipPath>
  </defs>

  <!-- app tile -->
  <rect x="10" y="10" width="236" height="236" rx="52"
        fill="url(#tileGold)"/>
  <rect x="18" y="18" width="220" height="220" rx="48"
        fill="url(#tileWater)"/>

  <!-- reed silhouettes (clipped to tile) -->
  <g clip-path="url(#tileClip)" opacity="0.35" fill="none" stroke="#4caf50" stroke-width="3" stroke-linecap="round">
    <path d="M52 210 C54 170 46 140 50 110"/>
    <path d="M64 210 C70 168 62 136 68 108"/>
    <path d="M198 210 C194 172 204 142 200 118"/>
    <path d="M210 210 C214 176 208 146 216 122"/>
  </g>

  <!-- distant lily -->
  <g clip-path="url(#tileClip)" opacity="0.55">
    <ellipse cx="188" cy="78" rx="22" ry="8" fill="#66bb6a"/>
    <circle cx="188" cy="70" r="10" fill="#fff8e1"/>
    <circle cx="188" cy="70" r="4" fill="#ffca28"/>
  </g>

  <!-- glyph (scaled/centered from the isolated artwork) -->
  <g id="thumbelina-glyph" transform="translate(28 58) scale(1.0)">
    <ellipse cx="96" cy="118" rx="70" ry="10" fill="#000" opacity="0.22"/>

    <path fill="url(#petalGrad)"
          d="M28 96
             C28 62 58 34 96 34
             C128 34 152 48 164 68
             C168 74 168 82 162 86
             C140 98 108 108 78 108
             C54 108 34 104 28 96
             Z"/>
    <path fill="none" stroke="#fff0f6" stroke-width="3" stroke-linecap="round" opacity="0.55"
          d="M40 88 C52 58 86 42 118 46 C138 48 152 58 160 70"/>

    <path fill="url(#sepalGrad)"
          d="M152 70
             C160 62 172 64 178 74
             C182 80 180 90 172 94
             C164 98 154 94 150 86
             C148 80 148 74 152 70
             Z"/>

    <g>
      <rect x="172" y="66" width="26" height="22" rx="2.5" fill="url(#usbGrad)" stroke="#607d8b" stroke-width="1.25"/>
      <rect x="175" y="70" width="14" height="14" rx="1" fill="#78909c"/>
      <rect x="178" y="73" width="4.5" height="4.5" rx="0.6" fill="#37474f"/>
      <rect x="178" y="80" width="4.5" height="4.5" rx="0.6" fill="#37474f"/>
    </g>

    <g>
      <path fill="#1565c0"
            d="M86 78
               C84 92 82 104 90 108
               C98 112 112 110 116 100
               C118 92 114 80 108 76
               C102 72 90 72 86 78
               Z"/>
      <ellipse cx="100" cy="76" rx="12" ry="7" fill="#e3f2fd"/>
      <circle cx="100" cy="58" r="11" fill="#ffccbc"/>
      <path fill="url(#hairGrad)"
            d="M88 58
               C86 44 96 38 106 40
               C114 42 116 52 112 60
               C118 56 120 64 112 68
               C106 66 98 66 92 64
               C88 66 86 62 88 58
               Z"/>
      <path fill="#ffccbc"
            d="M112 82 C120 80 128 84 132 88 C128 90 120 88 114 86 Z"/>
    </g>

    <g transform="translate(48 28)">
      <ellipse cx="-5" cy="0" rx="7" ry="4.5" fill="#fafafa" stroke="#cfd8dc" stroke-width="0.8" transform="rotate(-25)"/>
      <ellipse cx="5" cy="0" rx="7" ry="4.5" fill="#fafafa" stroke="#cfd8dc" stroke-width="0.8" transform="rotate(25)"/>
      <circle cx="0" cy="0" r="1.4" fill="#eceff1"/>
    </g>
  </g>
</svg>
