<?xml version="1.0" encoding="UTF-8"?>
<!--
  Thumbelina glyph - isolated mark, transparent background, no app tile.
  USB-A flash drive in profile: gold plug shell (with its punched detent)
  stepping through a gold collar into a rose shell with a gold-rimmed eyelet.
  Heights taper 26 -> 30 -> 48, matching real plug/shroud/body proportions.
  The top light and base shade share the shell's edges and radius, so they
  model the form without leaving a seam.
  Geometry is shared with thumbelina-mark.svg and thumbelina-glyph-mono.svg.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 122 56"
     width="122" height="56"
     role="img"
     aria-label="Thumbelina">
  <title>Thumbelina</title>
  <defs>
    <!-- rose shell: light from above, deep rose falloff toward the base -->
    <linearGradient id="tb-shell" x1="40" y1="4" x2="72" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff9ec5"/>
      <stop offset="0.3" stop-color="#f06292"/>
      <stop offset="0.7" stop-color="#e0356f"/>
      <stop offset="1" stop-color="#ad1457"/>
    </linearGradient>

    <linearGradient id="tb-sheen" x1="0" y1="4" x2="0" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="tb-base" x1="0" y1="30" x2="0" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6d0d33" stop-opacity="0"/>
      <stop offset="1" stop-color="#6d0d33" stop-opacity="0.32"/>
    </linearGradient>

    <!-- one stroke doing two jobs: top bevel light, bottom edge shade -->
    <linearGradient id="tb-bevel" x1="0" y1="4" x2="0" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.62"/>
      <stop offset="0.34" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.68" stop-color="#4a0b22" stop-opacity="0"/>
      <stop offset="1" stop-color="#4a0b22" stop-opacity="0.45"/>
    </linearGradient>

    <!-- brushed gold: banded specular across the plug shell -->
    <linearGradient id="tb-plug" x1="0" y1="15" x2="0" y2="41" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a3801c"/>
      <stop offset="0.08" stop-color="#d8b545"/>
      <stop offset="0.24" stop-color="#f4e2a6"/>
      <stop offset="0.4" stop-color="#fdf6de"/>
      <stop offset="0.56" stop-color="#e3c463"/>
      <stop offset="0.74" stop-color="#f0d78c"/>
      <stop offset="0.9" stop-color="#b8901f"/>
      <stop offset="1" stop-color="#8a6a12"/>
    </linearGradient>

    <linearGradient id="tb-collar" x1="0" y1="13" x2="0" y2="43" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8a6a12"/>
      <stop offset="0.16" stop-color="#c9a52f"/>
      <stop offset="0.36" stop-color="#e8d191"/>
      <stop offset="0.52" stop-color="#f5e6b4"/>
      <stop offset="0.72" stop-color="#d4af37"/>
      <stop offset="0.9" stop-color="#9c7818"/>
      <stop offset="1" stop-color="#6b4e0c"/>
    </linearGradient>

    <!-- punched detent in the plug shell -->
    <linearGradient id="tb-detent" x1="0" y1="23" x2="0" y2="33" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3a2a0c"/>
      <stop offset="1" stop-color="#6f5415"/>
    </linearGradient>

    <linearGradient id="tb-eyelet" x1="0" y1="21" x2="0" y2="35" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6d0b31" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#a8305f" stop-opacity="0.5"/>
    </linearGradient>

    <!-- collar shadow falling onto the shell -->
    <linearGradient id="tb-underlap" x1="36" y1="0" x2="44" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6d0d33" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6d0d33" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g id="thumbelina-glyph">
    <!-- shell -->
    <rect x="34" y="4" width="84" height="48" rx="9" fill="url(#tb-shell)"/>
    <rect x="34" y="30" width="84" height="22" rx="9" fill="url(#tb-base)"/>
    <rect x="34" y="4" width="84" height="22" rx="9" fill="url(#tb-sheen)"/>
    <rect x="36" y="13" width="8" height="30" fill="url(#tb-underlap)"/>
    <!-- lanyard eyelet -->
    <rect x="105" y="21" width="6" height="14" rx="3" fill="url(#tb-eyelet)"
          stroke="#d4af37" stroke-opacity="0.55" stroke-width="0.9"/>
    <!-- bevel: light top edge, shaded bottom edge -->
    <rect x="34.8" y="4.8" width="82.4" height="46.4" rx="8.4"
          fill="none" stroke="url(#tb-bevel)" stroke-width="1.6"/>

    <!-- collar -->
    <rect x="26" y="13" width="10" height="30" rx="2" fill="url(#tb-collar)"
          stroke="#6b4e0c" stroke-opacity="0.3" stroke-width="0.8"/>

    <!-- plug shell -->
    <rect x="4" y="15" width="24" height="26" rx="2" fill="url(#tb-plug)"
          stroke="#7d5f10" stroke-opacity="0.32" stroke-width="0.9"/>
    <rect x="6.2" y="16.6" width="1.4" height="22.8" rx="0.7" fill="#fffdf2" opacity="0.5"/>
    <rect x="10" y="23" width="11" height="10" rx="2" fill="url(#tb-detent)"/>
    <rect x="10.8" y="31.7" width="9.4" height="1" rx="0.5" fill="#fdf6de" opacity="0.55"/>
  </g>
</svg>
