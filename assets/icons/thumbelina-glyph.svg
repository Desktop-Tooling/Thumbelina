<?xml version="1.0" encoding="UTF-8"?>
<!-- Isolated Thumbelina mark: simple USB flash drive in brand colors. No tile. -->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 128 128"
     role="img"
     aria-label="Thumbelina">
  <title>Thumbelina</title>
  <defs>
    <linearGradient id="body" x1="24" y1="20" x2="104" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff8fb8"/>
      <stop offset="55%" stop-color="#e91e8c"/>
      <stop offset="100%" stop-color="#9b1b5e"/>
    </linearGradient>
    <linearGradient id="gold" x1="40" y1="88" x2="88" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f3e2a7"/>
      <stop offset="100%" stop-color="#c9a227"/>
    </linearGradient>
  </defs>

  <g id="thumbelina-glyph">
    <!-- drive body -->
    <rect x="28" y="18" width="72" height="78" rx="14" fill="url(#body)"/>
    <!-- highlight stripe -->
    <rect x="36" y="28" width="10" height="50" rx="5" fill="#ffffff" opacity="0.28"/>
    <!-- label window -->
    <rect x="52" y="36" width="36" height="22" rx="4" fill="#fff0f6" opacity="0.9"/>
    <rect x="56" y="42" width="28" height="4" rx="2" fill="#c9a227"/>
    <rect x="56" y="50" width="18" height="3" rx="1.5" fill="#e91e8c" opacity="0.55"/>
    <!-- USB-A connector -->
    <rect x="46" y="92" width="36" height="22" rx="3" fill="url(#gold)" stroke="#8a6a12" stroke-width="1.5"/>
    <rect x="52" y="98" width="8" height="10" rx="1" fill="#6d4c0f" opacity="0.55"/>
    <rect x="68" y="98" width="8" height="10" rx="1" fill="#6d4c0f" opacity="0.55"/>
  </g>
</svg>
